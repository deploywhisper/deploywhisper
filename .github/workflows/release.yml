# Candidate image and signed source must pass verification before publication.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Serialize all releases, including reruns, across version tags.
concurrency:
  group: deploywhisper-release-publication
  cancel-in-progress: false
  queue: max

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/deploywhisper

jobs:
  validate:
    name: "Validate Release"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image_version: ${{ steps.meta.outputs.image_version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Validate exact tag and project version
        id: meta
        run: python3 scripts/release_policy.py validate --tag "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - name: Verify tag is on default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"
  # ===========================================================================
  # STAGE 2 — FULL TEST SUITE (non-sharded, final gate)
  # ===========================================================================
  test:
    name: "Full Test Suite"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt

      - name: Run prompt-injection release gate
        run: python -m pytest tests/test_llm/test_prompt_injection.py -v --tb=short

      - name: Run full test suite
        run: |
          python -m pytest tests/ \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            -v \
            --tb=short \
            2>&1 | tee test-results.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Verify Alembic migrations apply cleanly
        run: |
          export DATABASE_URL=sqlite:////tmp/release-migration-test.db
          python -m alembic -c alembic.ini upgrade head
          echo "All migrations applied successfully."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-test-results
          path: |
            test-results.log
            coverage.xml
          retention-days: 90

  # ===========================================================================
  # STAGE 3 — SECURITY AUDIT (block release on vulnerabilities)
  # ===========================================================================
  security:
    name: "Security Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Audit dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
          pip-audit \
            --requirement requirements.txt \
            --strict \
            --desc \
            2>&1 | tee pip-audit-release.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-security-audit
          path: pip-audit-release.log
          retention-days: 90

  artifacts:
    name: Signed source artifacts
    needs: [validate, test, security]
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/release-artifacts.yml
    with:
      release-label: ${{ needs.validate.outputs.version }}

  docker:
    name: "Verify Candidate Image"
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [validate, test, security]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.validate.outputs.image_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Establish lowercase image identity
        id: image
        run: echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
      - name: Refuse existing release or immutable image and stable downgrade
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: python3 scripts/release_policy.py guard --version "$VERSION" --image "$IMAGE" --repository "$GITHUB_REPOSITORY"
      - name: Build and push unique candidate only
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.name }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=${{ needs.validate.outputs.image_version }}
            BUILD_SHA=${{ github.sha }}
      - name: Smoke test the exact candidate digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull --platform linux/amd64 "$IMAGE@$DIGEST"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$IMAGE@$DIGEST")" = "$VERSION"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE@$DIGEST")" = "$GITHUB_SHA"
          docker run -d --name release-smoke --platform linux/amd64 -p 8080:8080 \
            -v whisper-release-data:/app/data -e APP_HOST=0.0.0.0 -e APP_PORT=8080 \
            -e DATABASE_URL=sqlite:///data/deploywhisper.db "$IMAGE@$DIGEST"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/v1/health > /dev/null; then
              docker exec release-smoke python -c 'import sys; from config import settings; assert settings.app_version == sys.argv[1]' "$VERSION"
              exit 0
            fi
            sleep 2
          done
          docker logs release-smoke
          exit 1
      - name: Attest verified OCI candidate
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Verify OCI provenance and source identity
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh attestation verify "oci://$IMAGE@$DIGEST" --bundle-from-oci \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --signer-digest "$GITHUB_SHA" --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" --deny-self-hosted-runners
      - name: Cleanup
        if: always()
        run: |
          docker rm -f release-smoke 2>/dev/null || true
          docker volume rm whisper-release-data 2>/dev/null || true

  release:
    name: "Promote Verified Release"
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validate, docker, artifacts]
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.validate.outputs.image_version }}
      RELEASE_TAG: ${{ needs.validate.outputs.version }}
      IMAGE: ${{ needs.docker.outputs.image }}
      DIGEST: ${{ needs.docker.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Download signed source from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.artifacts.outputs.artifact-name }}
          path: dist/release
      - name: Verify source asset bundle before publication
        run: |
          test "${{ needs.artifacts.outputs.source-sha }}" = "$GITHUB_SHA"
          for subject in "dist/release/deploywhisper-$RELEASE_TAG.tar.gz" dist/release/SHA256SUMS dist/release/source-manifest.json; do
            gh attestation verify "$subject" \
              --bundle dist/release/artifact.intoto.jsonl --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-artifacts.yml" \
              --signer-digest "$GITHUB_SHA" --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          done
          (cd dist/release && sha256sum --strict --check SHA256SUMS)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Recheck publication state under release concurrency lock
        run: python3 scripts/release_policy.py guard --version "$VERSION" --image "$IMAGE" --repository "$GITHUB_REPOSITORY"
      - name: Prepare release notes
        run: |
          if [ -f "docs/releases/$RELEASE_TAG.md" ]; then
            cp "docs/releases/$RELEASE_TAG.md" release-notes.md
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$RELEASE_TAG" --jq .body > release-notes.md
          fi
      - name: Create new release with verified immutable assets
        run: |
          options=()
          if [[ "$VERSION" == *-* ]]; then options+=(--prerelease --latest=false); else options+=(--latest); fi
          python3 scripts/release_policy.py verify-remote-tag --tag "$RELEASE_TAG" --source-sha "$GITHUB_SHA"
          gh release create "$RELEASE_TAG" --verify-tag --title "DeployWhisper $RELEASE_TAG" \
            --notes-file release-notes.md "${options[@]}" \
            "dist/release/deploywhisper-$RELEASE_TAG.tar.gz" \
            dist/release/SHA256SUMS dist/release/source-manifest.json dist/release/artifact.intoto.jsonl
      - name: Promote verified digest to version and eligible stable aliases
        run: |
          tags=(--tag "$IMAGE:$VERSION")
          if [[ "$VERSION" != *-* ]]; then
            tags+=(--tag "$IMAGE:latest" --tag "$IMAGE:${VERSION%.*}" --tag "$IMAGE:${VERSION%%.*}")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$DIGEST"
