name: OpenSSF Scorecard

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: Scorecard posture
    # PR runs inspect the checkout locally; repository/API checks use the
    # default branch. Never publish a feature/release branch as that baseline.
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assess supply-chain posture
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - name: Preserve available SARIF even after a failed scan
        if: always() && hashFiles('results.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          if-no-files-found: error
          retention-days: 30
      - name: Upload posture to code scanning
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
          category: openssf-scorecard
      - name: Explain result scope and triage
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## OpenSSF Scorecard

          PR local runs inspect the submitted checkout and provide a partial posture assessment.
          Full default-branch runs include repository/API checks. Compare those runs for the baseline.
          Available SARIF is retained as the scorecard-sarif artifact and uploaded to the Security code scanning tab.
          Scan or upload failures remain visible in this job; a missing report is not a clean result.
          Results are not published to the external Scorecard service.

          See [scan coverage and findings triage](https://github.com/deploywhisper/deploywhisper/blob/develop/docs/security/supply-chain-scanning.md).
          SUMMARY
