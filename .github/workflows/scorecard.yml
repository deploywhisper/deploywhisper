name: OpenSSF Scorecard

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: Scorecard posture
    # Base-repository PRs, including fork contributions, get unpublished local
    # scans. Workflow execution inside a fork repository is unsupported.
    if: github.event_name == 'pull_request' && github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assess supply-chain posture
        id: scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          # Bind output to this immutable checkout and workflow attempt.
          results_file: scorecard-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}.sarif
          results_format: sarif
          publish_results: false
      - name: Preserve SARIF from a successful scan
        if: always() && steps.scorecard.outcome == 'success' && hashFiles(format('scorecard-{0}-{1}-{2}.sarif', github.sha, github.run_id, github.run_attempt)) != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: scorecard-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}.sarif
          if-no-files-found: error
          retention-days: 30
      - name: Upload posture to code scanning
        if: always() && steps.scorecard.outcome == 'success' && hashFiles(format('scorecard-{0}-{1}-{2}.sarif', github.sha, github.run_id, github.run_attempt)) != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scorecard-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}.sarif
          category: openssf-scorecard
      - name: Explain result scope and triage
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## OpenSSF Scorecard

          PR local runs inspect the submitted checkout and provide a partial posture assessment.
          Full default-branch runs and badge publication use the separate restricted publishing workflow.
          SARIF from successful scans is retained as the scorecard-sarif artifact and uploaded to the Security code scanning tab.
          Scan or upload failures remain visible in this job; a missing report is not a clean result.
          Results are not published to the external Scorecard service.

          See [scan coverage and findings triage](https://github.com/deploywhisper/deploywhisper/blob/develop/docs/security/supply-chain-scanning.md).
          SUMMARY
