name: Publish OpenSSF Scorecard

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish default-branch Scorecard
    if: github.event.repository.fork == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
    # Publication provenance validation allows only these pinned actions.
    # Do not add env/defaults/run steps, services, or repository execution.
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assess and publish repository posture
        id: scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          # Bind output to this immutable checkout and workflow attempt.
          results_file: scorecard-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}.sarif
          results_format: sarif
          publish_results: true
      - name: Preserve available SARIF even after a failed scan
        if: always() && hashFiles(format('scorecard-{0}-{1}-{2}.sarif', github.sha, github.run_id, github.run_attempt)) != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-repository-sarif
          path: scorecard-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}.sarif
          if-no-files-found: error
          retention-days: 30
      - name: Upload repository posture to code scanning
        if: always() && hashFiles(format('scorecard-{0}-{1}-{2}.sarif', github.sha, github.run_id, github.run_attempt)) != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scorecard-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}.sarif
          category: openssf-scorecard-repository
