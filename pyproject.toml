[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "deploywhisper"
version = "1.4.0"
description = "AI-powered pre-deployment risk intelligence for infrastructure changes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.136.1",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.54",
  "alembic==1.18.4",
  "pydantic==2.14.1",
  "openai==2.32.0",
  "anthropic==1.13.0",
  "google-genai==2.29.0",
  "pyyaml==6.0.3",
  "ruamel.yaml==0.19.1",
  "deepdiff==9.0.0",
  "python-hcl2==8.1.4",
  "python-dotenv==1.2.2",
  "markdown-it-py==4.0.0",
]

[project.scripts]
deploywhisper = "cli.analyze:main"

[tool.hatch.build.targets.wheel]
packages = [
  "api",
  "services",
  "integrations",
  "infra_automation",
  "parsers",
  "analysis",
  "evidence",
  "llm",
  "models",
  "cli",
]
