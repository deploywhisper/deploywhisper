# Disposable operator settings browser proof: no receiver or collection qualification.
name: deploywhisper-story16-18
services:
  deploywhisper:
    image: deploywhisper-story16-18:ui-proof
    build:
      context: ..
      target: runtime
    user: appuser
    working_dir: /app
    command: [python, /tmp/settings_ui_fixture.py]
    init: true
    restart: "no"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SETTINGS_UI_DISPOSABLE: "1"
      TRIGGER_UI_DISPOSABLE: "1"
      AUTOMATION_UI_DISPOSABLE: "1"
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      APP_BASE_URL: http://localhost:8080
      DATABASE_URL: sqlite:////app/data/deploywhisper.db
      DEPLOYWHISPER_IDENTITY_PROFILE: local-development
      DEPLOYWHISPER_IDENTITY_ORIGIN: http://localhost:8080
      DEPLOYWHISPER_AUTHORIZATION_PROFILE: verified
      DEPLOYWHISPER_IDENTITY_DECISION_MODE: shared
      NARRATOR_ENABLED: "false"
      LLM_PROVIDER: ollama
      LLM_API_BASE: http://127.0.0.1:9
      LLM_API_KEY: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      OPENROUTER_API_KEY: ""
      GROQ_API_KEY: ""
      XAI_API_KEY: ""
      DEPLOYWHISPER_SHARE_TOKEN: ""
      LOG_LEVEL: WARNING
    tmpfs:
      - /app/data:rw,noexec,nosuid,nodev,mode=1777,size=256m
    volumes:
      - type: bind
        source: ./trigger_ui_fixture.py
        target: /tmp/trigger_ui_fixture.py
        read_only: true
      - type: bind
        source: ./seed_infra_automation_ui.py
        target: /tmp/seed_infra_automation_ui.py
        read_only: true
      - type: bind
        source: ./settings_ui_fixture.py
        target: /tmp/settings_ui_fixture.py
        read_only: true
